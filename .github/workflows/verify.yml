name: Verify template package
on:
  workflow_call:
    inputs:
      package-version:
        description: Template package version derived from the release tag
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TemplatePackageVersion: ${{ inputs.package-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Install, generate, build and test the template matrix
        shell: pwsh
        run: ./scripts/Verify-Template.ps1
      - name: Check workflows, scripts and handbook links
        shell: pwsh
        run: ./scripts/Test-Repository.ps1
      - name: Check template release validation
        shell: pwsh
        run: ./scripts/Test-TemplateRelease.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NINA.Plugin.Templates
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Keep verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results
          path: |
            artifacts/verification-*/results.json
            artifacts/verification-*/*/*.log
            artifacts/verification-*/*/results/*.trx
