name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'
      - name: Restore, build and test
        shell: pwsh
        run: |
          $solution = (Get-ChildItem -Filter *.slnx).FullName
          dotnet restore $solution
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build $solution -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (Test-Path tests) { dotnet test $solution -c Release --no-build --no-restore }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate distributable
        shell: pwsh
        env:
          PLUGIN_REPOSITORY: ${{ github.repository }}
        run: |
          $project = (Get-ChildItem src -Filter *.csproj -Recurse).FullName
          dotnet msbuild $project -t:PackagePlugin -p:Configuration=Release "-p:RepositoryUrl=https://github.com/$env:PLUGIN_REPOSITORY"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-validation
          path: artifacts/release/*
          if-no-files-found: error
